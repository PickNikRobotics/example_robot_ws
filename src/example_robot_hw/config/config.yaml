based_on_package: example_robot_sim

# Launch file started by the MoveIt Pro Runtime for the physical robot.
# [Required]
runtime_launch_file:
  package: "example_robot_hw"
  path: "launch/runtime.launch.xml"

hardware:
  # Parameters used to configure the robot description through XACRO.
  # A URDF and SRDF are both required.
  # [Required]
  robot_description:
    # Specify any additional parameters required for the URDF.
    # Many of these are specific to the descriptions packages, and can be customized as needed.
    # [Optional]
    urdf_params:
        # Use "mock", "mujoco", or "physical"
      - hardware_interface: "physical"
      - robot_ip: "192.10.0.11"
      - tool_device_name: "/dev/ttyUSB0"
